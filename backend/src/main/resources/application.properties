spring.application.name=shopkart
server.port=${PORT:8080}

spring.datasource.url=jdbc:h2:file:./data/shopkart;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

shopkart.ai.enabled=${SHOPKART_AI_ENABLED:false}
shopkart.frontend-origins=${SHOPKART_FRONTEND_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
spring.ai.openai.api-key=${OPENAI_API_KEY:NOT_CONFIGURED}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}

logging.level.org.springframework.ai=INFO
